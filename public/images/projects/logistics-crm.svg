        <line x1="0" y1="160" x2="600" y2="160" stroke="#ffffff" stroke-opacity="0.03" />
        <line x1="0" y1="240" x2="600" y2="240" stroke="#ffffff" stroke-opacity="0.03" />
        <line x1="0" y1="320" x2="600" y2="320" stroke="#ffffff" stroke-opacity="0.03" />
        <line x1="0" y1="400" x2="600" y2="400" stroke="#ffffff" stroke-opacity="0.03" />

        <line x1="120" y1="0" x2="120" y2="474" stroke="#ffffff" stroke-opacity="0.03" />
        <line x1="240" y1="0" x2="240" y2="474" stroke="#ffffff" stroke-opacity="0.03" />
        <line x1="360" y1="0" x2="360" y2="474" stroke="#ffffff" stroke-opacity="0.03" />
        <line x1="480" y1="0" x2="480" y2="474" stroke="#ffffff" stroke-opacity="0.03" />

        <!-- Route Path 1: Chicago (ORD) -> Nashville (BNA) -> Atlanta (ATL) -> Miami (MIA) -->
        <path d="M 120,90 Q 220,180 290,260 T 460,410" fill="none" stroke="#f97316" stroke-width="3.5" stroke-dasharray="10 5" filter="url(#crm-glow)" />

        <!-- Route Path 2: Dallas -> Memphis -> Charlotte -->
        <path d="M 60,320 Q 200,280 320,240 T 520,210" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.65" />

