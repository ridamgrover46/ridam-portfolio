<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="crm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0c0e17" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <linearGradient id="emerald-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="panel-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121622" />
      <stop offset="100%" stop-color="#0b0d15" />
    </linearGradient>

    <filter id="crm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="750" fill="url(#crm-bg)" rx="16" />
  <rect width="1198" height="748" x="1" y="1" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" rx="15" />

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="46" fill="#090b12" rx="16" />
  <circle cx="28" cy="23" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="48" cy="23" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="68" cy="23" r="5.5" fill="#10b981" opacity="0.85" />

  <rect x="100" y="11" width="380" height="24" rx="6" fill="#141824" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <circle cx="116" cy="23" r="3" fill="#10b981" />
  <text x="128" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
    freight-crm.app / dispatch / live-board / load-manifests / #LD-88921
  </text>

  <!-- Telemetry Indicator -->
  <rect x="1000" y="12" width="176" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="1014" cy="23" r="3.5" fill="#10b981" />
  <text x="1026" y="27" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">
    GPS REFRESH: 2.4s • ONLINE
  </text>

  <!-- Top Metric Cards Row -->
  <g transform="translate(24, 62)">
    <!-- KPI 1: Active Fleet -->
    <g transform="translate(0, 0)">
      <rect width="272" height="88" rx="12" fill="url(#panel-surface)" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
      <text x="20" y="30" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ACTIVE FLEET DISPATCH</text>
      <text x="20" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">142 Units</text>
      <rect x="190" y="26" width="64" height="22" rx="6" fill="#10b981" fill-opacity="0.15" />
      <text x="200" y="41" fill="#10b981" font-family="monospace" font-size="10.5" font-weight="700">+12% WoW</text>
    </g>

    <!-- KPI 2: On-Time Rate -->
    <g transform="translate(292, 0)">
      <rect width="272" height="88" rx="12" fill="url(#panel-surface)" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
      <text x="20" y="30" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ON-TIME DELIVERY SLA</text>
      <text x="20" y="66" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">98.6%</text>
      <rect x="190" y="26" width="64" height="22" rx="6" fill="#10b981" fill-opacity="0.15" />
      <text x="202" y="41" fill="#10b981" font-family="monospace" font-size="10.5" font-weight="700">OPTIMAL</text>
    </g>

    <!-- KPI 3: In-Transit Freight -->
    <g transform="translate(584, 0)">
      <rect width="272" height="88" rx="12" fill="url(#panel-surface)" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
      <text x="20" y="30" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">GROSS REVENUE VALUATION</text>
      <text x="20" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">$1,280,450</text>
      <rect x="190" y="26" width="64" height="22" rx="6" fill="#f97316" fill-opacity="0.15" />
      <text x="202" y="41" fill="#f97316" font-family="monospace" font-size="10.5" font-weight="700">ESCROW</text>
    </g>

    <!-- KPI 4: DOT Compliance -->
    <g transform="translate(876, 0)">
      <rect width="276" height="88" rx="12" fill="url(#panel-surface)" stroke="#f97316" stroke-opacity="0.3" stroke-width="1" />
      <text x="20" y="30" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">FMCSA SAFETY RATING</text>
      <text x="20" y="66" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800">99.8 / 100</text>
      <rect x="180" y="26" width="76" height="22" rx="6" fill="#f97316" fill-opacity="0.2" />
      <text x="190" y="41" fill="#fdba74" font-family="monospace" font-size="10" font-weight="700">AUDIT PASS</text>
    </g>
  </g>

  <!-- Center Content: GPS Telematics Map + Live Dispatch Manifest -->
  <g transform="translate(24, 168)">
    <!-- Left Map View (Live GPS Tracking) -->
    <g transform="translate(0, 0)">
      <rect width="640" height="554" rx="14" fill="url(#panel-surface)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

      <!-- Map Header -->
      <text x="24" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Real-Time Transit Radar</text>
      <text x="200" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Midwest to Southeast Corridor</text>

      <rect x="510" y="18" width="106" height="26" rx="6" fill="#141824" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <text x="522" y="35" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">SATELLITE 3D</text>

      <!-- Simulated Dark Vector Map Graphics -->
      <g transform="translate(20, 56)">
        <rect width="600" height="474" rx="10" fill="#080a11" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

