        <circle cx="120" cy="90" r="14" fill="#f97316" fill-opacity="0.2" />
        <circle cx="120" cy="90" r="6" fill="#f97316" />
        <rect x="74" y="58" width="92" height="22" rx="4" fill="#0d111b" stroke="#f97316" stroke-width="1" />
        <text x="82" y="73" fill="#ffffff" font-family="monospace" font-size="10" font-weight="700">ORD: LOADED</text>

        <!-- Waypoint: Atlanta Hub -->
        <circle cx="290" cy="260" r="18" fill="#f97316" fill-opacity="0.25" filter="url(#crm-glow)" />
        <circle cx="290" cy="260" r="7" fill="#ffffff" />
        <rect x="238" y="218" width="104" height="26" rx="5" fill="#0d111b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1" />
        <text x="248" y="235" fill="#fdba74" font-family="monospace" font-size="10.5" font-weight="700">TRUCK #88921</text>

        <!-- Waypoint: Miami Port -->
        <circle cx="460" cy="410" r="14" fill="#10b981" fill-opacity="0.2" />
        <circle cx="460" cy="410" r="6" fill="#10b981" />
        <rect x="420" y="426" width="80" height="22" rx="4" fill="#0d111b" stroke="#10b981" stroke-width="1" />
        <text x="428" y="441" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700">MIA: DEST</text>

        <!-- Telemetry Floating Overlay Card -->
        <g transform="translate(320, 280)">
          <rect width="260" height="130" rx="10" fill="#0d111a" fill-opacity="0.95" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5" />
          <text x="16" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Freight Telemetry HUD</text>
          <rect x="180" y="12" width="66" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
          <text x="188" y="25" fill="#10b981" font-family="monospace" font-size="9" font-weight="700">IN TRANSIT</text>

          <text x="16" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Current Speed: <tspan fill="#ffffff" font-weight="700">67.4 MPH</tspan></text>
          <text x="16" y="72" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Reefer Unit Temp: <tspan fill="#38bdf8" font-weight="700">34.2°F</tspan></text>
          <text x="16" y="92" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">ETA Miami Port: <tspan fill="#fdba74" font-weight="700">Today 18:45 EST</tspan></text>
          <text x="16" y="112" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Driver: <tspan fill="#ffffff" font-weight="600">Marcus Vance (DOT #4892)</tspan></text>
        </g>
      </g>
    </g>

    <!-- Right Active Manifest Table + Carrier Compliance -->
    <g transform="translate(664, 0)">
      <rect width="488" height="554" rx="14" fill="url(#panel-surface)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

      <text x="24" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Active Load Manifests</text>
      <text x="210" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Live Rate Confirmations</text>

      <!-- Manifest Cards -->
      <!-- Card 1 -->
      <g transform="translate(20, 56)">
        <rect width="448" height="110" rx="10" fill="#0f1320" stroke="#f97316" stroke-opacity="0.3" stroke-width="1" />
        <text x="18" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">LD-88921 • Medical Supplies</text>
        <rect x="354" y="14" width="78" height="20" rx="4" fill="#f97316" fill-opacity="0.2" />
        <text x="362" y="28" fill="#fdba74" font-family="monospace" font-size="9.5" font-weight="700">$4,850.00</text>

        <text x="18" y="52" fill="#94a3b8" font-family="monospace" font-size="11">Origin: Chicago IL (ORD) → Dest: Miami FL (MIA)</text>
        <text x="18" y="70" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Carrier: Apex Freight Lines • MC #928410 • Reefer 53ft</text>

        <!-- Compliance Pill & Action -->
        <rect x="18" y="82" width="130" height="18" rx="4" fill="#10b981" fill-opacity="0.15" />
        <text x="26" y="94" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700">✓ DOT VERIFIED ACTIVE</text>

        <rect x="340" y="78" width="92" height="24" rx="6" fill="#f97316" />
        <text x="354" y="94" fill="#0c0e16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">DIAL DRIVER</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(20, 178)">
        <rect width="448" height="110" rx="10" fill="#0f1320" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
        <text x="18" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">LD-88914 • Automotive Components</text>
        <rect x="354" y="14" width="78" height="20" rx="4" fill="#10b981" fill-opacity="0.2" />
        <text x="362" y="28" fill="#6ee7b7" font-family="monospace" font-size="9.5" font-weight="700">$3,200.00</text>

        <text x="18" y="52" fill="#94a3b8" font-family="monospace" font-size="11">Origin: Detroit MI → Dest: Dallas TX</text>
        <text x="18" y="70" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Carrier: Great Lakes Express • MC #847291 • Dry Van</text>

        <rect x="18" y="82" width="130" height="18" rx="4" fill="#10b981" fill-opacity="0.15" />
        <text x="26" y="94" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700">✓ DOT VERIFIED ACTIVE</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(20, 300)">
        <rect width="448" height="110" rx="10" fill="#0f1320" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
        <text x="18" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">LD-88890 • Industrial Solar Panels</text>
        <rect x="354" y="14" width="78" height="20" rx="4" fill="#10b981" fill-opacity="0.2" />
        <text x="362" y="28" fill="#6ee7b7" font-family="monospace" font-size="9.5" font-weight="700">$5,600.00</text>

        <text x="18" y="52" fill="#94a3b8" font-family="monospace" font-size="11">Origin: Austin TX → Dest: Phoenix AZ</text>
        <text x="18" y="70" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Carrier: Lone Star Transport • MC #392817 • Flatbed</text>

        <rect x="18" y="82" width="130" height="18" rx="4" fill="#10b981" fill-opacity="0.15" />
        <text x="26" y="94" fill="#6ee7b7" font-family="monospace" font-size="9" font-weight="700">✓ DOT VERIFIED ACTIVE</text>
      </g>

      <!-- Bottom VoIP Integration Note -->
      <g transform="translate(20, 428)">
        <rect width="448" height="96" rx="10" fill="#141825" stroke="#f97316" stroke-opacity="0.2" stroke-width="1" />
        <circle cx="28" cy="28" r="10" fill="#f97316" />
        <path d="M 24,24 Q 28,20 32,24 L 30,27 Q 27,26 26,29 L 29,32" fill="none" stroke="#0c0e16" stroke-width="1.8" />
        <text x="48" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">RingCentral VoIP Integration Active</text>
        <text x="18" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Click-to-dial direct calling &amp; automated rate-con PDF email sync.</text>
        <text x="18" y="76" fill="#fdba74" font-family="monospace" font-size="10.5">RBAC: Broker • Dispatcher • Admin • Escrow Auditor</text>
      </g>
    </g>
  </g>
</svg>
