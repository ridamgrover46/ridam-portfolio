<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="fa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0e1018" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <linearGradient id="amber-vision" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="card-fa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0b0e15" />
    </linearGradient>

    <filter id="fa-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.12" />
    </filter>

    <filter id="fa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="750" fill="url(#fa-bg)" rx="16" />
  <rect width="1198" height="748" x="1" y="1" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" rx="15" />

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="46" fill="#090b12" rx="16" />
  <circle cx="28" cy="23" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="48" cy="23" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="68" cy="23" r="5.5" fill="#10b981" opacity="0.85" />

  <rect x="100" y="11" width="380" height="24" rx="6" fill="#141824" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <circle cx="116" cy="23" r="3" fill="#10b981" />
  <text x="128" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
    vision-auth.local / camera-feed / stream:0 / opencv-neural-pipeline
  </text>

  <!-- FPS & Model Metric -->
  <rect x="1000" y="12" width="176" height="22" rx="11" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="1014" cy="23" r="3.5" fill="#10b981" />
  <text x="1026" y="27" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">
    OPENCV 4.8 • 60 FPS • 99.4%
  </text>

  <!-- Main Grid Content -->
  <g transform="translate(24, 64)">
    <!-- Left: Live Video Feed Canvas with Face Mesh -->
    <g transform="translate(0, 0)" filter="url(#fa-shadow)">
      <rect width="660" height="638" rx="14" fill="url(#card-fa)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

      <text x="24" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Live Camera Stream: /dev/video0</text>
      <text x="280" y="36" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">● LIVE INFERENCE</text>

      <!-- Video Feed Screen Frame -->
      <g transform="translate(20, 56)">
        <rect width="620" height="560" rx="10" fill="#06080d" stroke="#f97316" stroke-opacity="0.3" stroke-width="1.5" />

        <!-- Camera HUD Reticle & Crosshairs -->
        <line x1="20" y1="20" x2="60" y2="20" stroke="#f97316" stroke-width="2.5" />
        <line x1="20" y1="20" x2="20" y2="60" stroke="#f97316" stroke-width="2.5" />

        <line x1="600" y1="20" x2="560" y2="20" stroke="#f97316" stroke-width="2.5" />
        <line x1="600" y1="20" x2="600" y2="60" stroke="#f97316" stroke-width="2.5" />

        <line x1="20" y1="540" x2="60" y2="540" stroke="#f97316" stroke-width="2.5" />
        <line x1="20" y1="540" x2="20" y2="500" stroke="#f97316" stroke-width="2.5" />

        <line x1="600" y1="540" x2="560" y2="540" stroke="#f97316" stroke-width="2.5" />
        <line x1="600" y1="540" x2="600" y2="500" stroke="#f97316" stroke-width="2.5" />

        <!-- Central Biometric Face Scanning Mesh -->
        <g transform="translate(170, 90)">
          <!-- Face Silhouette Outline -->
          <ellipse cx="140" cy="180" rx="110" ry="140" fill="#121624" fill-opacity="0.6" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6 4" />

          <!-- Face Bounding Box with Corner Brackets -->
          <rect x="10" y="20" width="260" height="320" rx="8" fill="none" stroke="#f97316" stroke-width="2" />
          <rect x="10" y="20" width="260" height="28" fill="#f97316" fill-opacity="0.15" />
          <text x="22" y="38" fill="#fdba74" font-family="monospace" font-size="11" font-weight="700">TARGET: RIDAM GROVER (ID: #0821)</text>

          <!-- 68-Point Facial Landmarks Simulation (Amber glowing dots) -->
          <!-- Eye Level -->
          <circle cx="85" cy="140" r="4" fill="#f97316" filter="url(#fa-glow)" />
          <circle cx="105" cy="140" r="3" fill="#fbbf24" />
          <circle cx="175" cy="140" r="3" fill="#fbbf24" />
          <circle cx="195" cy="140" r="4" fill="#f97316" filter="url(#fa-glow)" />

          <!-- Eyebrows -->
          <line x1="70" y1="120" x2="115" y2="122" stroke="#f97316" stroke-width="2" />
          <line x1="165" y1="122" x2="210" y2="120" stroke="#f97316" stroke-width="2" />

          <!-- Nose Bridge & Tip -->
          <line x1="140" y1="130" x2="140" y2="195" stroke="#f97316" stroke-width="2" stroke-dasharray="4 2" />
          <circle cx="140" cy="195" r="4" fill="#fbbf24" />
          <circle cx="120" cy="205" r="3" fill="#f97316" />
          <circle cx="160" cy="205" r="3" fill="#f97316" />

          <!-- Mouth & Lips -->
          <ellipse cx="140" cy="245" rx="35" ry="14" fill="none" stroke="#f97316" stroke-width="2" />
          <circle cx="105" cy="245" r="3" fill="#fbbf24" />
          <circle cx="175" cy="245" r="3" fill="#fbbf24" />

          <!-- Jawline Contours -->
          <path d="M 40,160 Q 60,280 140,320 Q 220,280 240,160" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 3" />

          <!-- Distance & Alignment Vector Line -->
          <line x1="140" y1="20" x2="140" y2="340" stroke="#10b981" stroke-width="1" stroke-dasharray="8 4" opacity="0.6" />

          <!-- Confidence Badge Bottom of Box -->
          <rect x="25" y="300" width="230" height="26" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
          <text x="36" y="317" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="700">CONFIDENCE: 99.4% • LIVENESS: PASS</text>
        </g>

        <!-- Bottom Telemetry HUD Bar -->
        <g transform="translate(20, 500)">
          <rect width="580" height="42" rx="8" fill="#0d111b" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
          <text x="18" y="26" fill="#94a3b8" font-family="monospace" font-size="11">Input: 1920x1080@60fps • Haar Cascade + FaceNet 128D Embedding • Latency: 16ms</text>
        </g>
      </g>
    </g>

    <!-- Right: Automated SQLite Ledger & Verification Records -->
    <g transform="translate(684, 0)" filter="url(#fa-shadow)">
      <rect width="468" height="638" rx="14" fill="url(#card-fa)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

      <text x="24" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Biometric Attendance Ledger</text>
      <text x="240" y="36" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">SQLite Database Active</text>

      <!-- Ledger Summary Stats -->
      <g transform="translate(20, 56)">
        <rect width="428" height="80" rx="10" fill="#0e111a" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
        <g transform="translate(18, 20)">
          <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="10.5">TODAY VERIFIED</text>
          <text x="0" y="44" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">482 / 500</text>
        </g>
        <g transform="translate(160, 20)">
          <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="10.5">FALSE ACCEPTANCE</text>
          <text x="0" y="44" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">&lt; 0.001%</text>
        </g>
        <g transform="translate(300, 20)">
          <text x="0" y="16" fill="#64748b" font-family="monospace" font-size="10.5">AVG VERIFY TIME</text>
          <text x="0" y="44" fill="#f97316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">142 ms</text>
        </g>
      </g>

      <!-- Ledger Row 1 (Recent Checked In) -->
      <g transform="translate(20, 150)">
        <rect width="428" height="96" rx="10" fill="#0f1422" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
        <circle cx="30" cy="30" r="14" fill="#10b981" fill-opacity="0.2" />
        <text x="24" y="35" fill="#10b981" font-family="sans-serif" font-size="14" font-weight="700">✓</text>
        <text x="56" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Ridam Grover</text>
        <text x="56" y="46" fill="#94a3b8" font-family="monospace" font-size="10.5">ID: #0821 • Engineering Dept</text>
        <rect x="310" y="16" width="102" height="22" rx="4" fill="#10b981" fill-opacity="0.15" />
        <text x="320" y="31" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="700">09:02:14 AM</text>
        <text x="18" y="76" fill="#64748b" font-family="monospace" font-size="10">Embedding Euclidean Dist: 0.28 (Threshold: 0.60) • Verified</text>
      </g>

      <!-- Ledger Row 2 -->
      <g transform="translate(20, 260)">
        <rect width="428" height="96" rx="10" fill="#0f1422" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
        <circle cx="30" cy="30" r="14" fill="#ffffff" fill-opacity="0.05" />
        <text x="24" y="35" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="700">✓</text>
        <text x="56" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Aarav Patel</text>
        <text x="56" y="46" fill="#94a3b8" font-family="monospace" font-size="10.5">ID: #0819 • Cloud Architecture</text>
        <rect x="310" y="16" width="102" height="22" rx="4" fill="#ffffff" fill-opacity="0.08" />
        <text x="320" y="31" fill="#cbd5e1" font-family="monospace" font-size="10" font-weight="700">08:58:32 AM</text>
        <text x="18" y="76" fill="#64748b" font-family="monospace" font-size="10">Embedding Euclidean Dist: 0.31 (Threshold: 0.60) • Verified</text>
      </g>

      <!-- Ledger Row 3 -->
      <g transform="translate(20, 370)">
        <rect width="428" height="96" rx="10" fill="#0f1422" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
        <circle cx="30" cy="30" r="14" fill="#ffffff" fill-opacity="0.05" />
        <text x="24" y="35" fill="#94a3b8" font-family="sans-serif" font-size="14" font-weight="700">✓</text>
        <text x="56" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Kavya Sharma</text>
        <text x="56" y="46" fill="#94a3b8" font-family="monospace" font-size="10.5">ID: #0794 • Mobile QA &amp; Dev</text>
        <rect x="310" y="16" width="102" height="22" rx="4" fill="#ffffff" fill-opacity="0.08" />
        <text x="320" y="31" fill="#cbd5e1" font-family="monospace" font-size="10" font-weight="700">08:54:19 AM</text>
        <text x="18" y="76" fill="#64748b" font-family="monospace" font-size="10">Embedding Euclidean Dist: 0.24 (Threshold: 0.60) • Verified</text>
      </g>

      <!-- Bottom Export & Integrity -->
      <g transform="translate(20, 484)">
        <rect width="428" height="130" rx="10" fill="#131724" stroke="#f97316" stroke-opacity="0.25" stroke-width="1" />
        <text x="20" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Automated Audit &amp; CSV Export</text>
        <text x="20" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Daily logs encrypted and exported automatically with timestamp hash.</text>

        <rect x="20" y="72" width="180" height="36" rx="8" fill="#f97316" />
        <text x="44" y="94" fill="#0c0e16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">EXPORT DAILY CSV</text>

        <rect x="214" y="72" width="194" height="36" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
        <text x="240" y="94" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ENROLL NEW FACE</text>
      </g>
    </g>
  </g>
</svg>
