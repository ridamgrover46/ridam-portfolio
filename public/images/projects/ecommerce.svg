<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="ecom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0e1018" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0b0e15" />
    </linearGradient>

    <linearGradient id="sneaker-art" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1e2d" />
      <stop offset="50%" stop-color="#2a334d" />
      <stop offset="100%" stop-color="#0e111a" />
    </linearGradient>

    <filter id="ecom-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.12" />
    </filter>

    <filter id="amber-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="750" fill="url(#ecom-bg)" rx="16" />
  <rect width="1198" height="748" x="1" y="1" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" rx="15" />

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="46" fill="#090b12" rx="16" />
  <circle cx="28" cy="23" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="48" cy="23" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="68" cy="23" r="5.5" fill="#10b981" opacity="0.85" />

  <rect x="100" y="11" width="370" height="24" rx="6" fill="#141824" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <circle cx="116" cy="23" r="3" fill="#10b981" />
  <text x="128" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
    store.nexus-commerce.app / catalog / luxury-footwear / stealth-matrix-01
  </text>

  <!-- Cart Items Counter -->
  <g transform="translate(1040, 10)">
    <rect width="134" height="26" rx="13" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#f97316" />
    <text x="28" y="17" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">CART: 2 ITEMS ($380)</text>
  </g>

  <!-- Main Store Layout -->
  <g transform="translate(24, 64)">
    <!-- Left: Store Navbar & Category Pills -->
    <g transform="translate(0, 0)">
      <rect width="1152" height="48" rx="10" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
      <text x="20" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">NEXUS STORE</text>

      <!-- Search Bar -->
      <rect x="160" y="8" width="320" height="32" rx="8" fill="#0a0c13" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
      <circle cx="180" cy="24" r="5" fill="none" stroke="#64748b" stroke-width="1.5" />
      <line x1="184" y1="28" x2="190" y2="34" stroke="#64748b" stroke-width="1.5" />
      <text x="198" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Search footwear, tech apparel, accessories...</text>

      <!-- Category Filter Pills -->
      <g transform="translate(500, 8)">
        <rect width="90" height="32" rx="8" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-opacity="0.4" stroke-width="1" />
        <text x="14" y="20" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">All Footwear</text>

        <g transform="translate(98, 0)">
          <rect width="90" height="32" rx="8" fill="#0d1017" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
          <text x="14" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Outerwear</text>
        </g>

        <g transform="translate(196, 0)">
          <rect width="90" height="32" rx="8" fill="#0d1017" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
          <text x="14" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Hardware</text>
        </g>
      </g>

      <!-- Auth State -->
      <g transform="translate(980, 8)">
        <rect width="150" height="32" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
        <circle cx="20" cy="16" r="8" fill="#f97316" />
        <text x="36" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Google OAuth ✓</text>
      </g>
    </g>

    <!-- Center Product Showcase (Large Hero Product Card) -->
    <g transform="translate(0, 64)" filter="url(#ecom-shadow)">
      <rect width="740" height="574" rx="14" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

      <!-- Ambient Light Behind Product -->
      <circle cx="370" cy="220" r="160" fill="#f97316" fill-opacity="0.12" filter="url(#amber-glow)" />

      <!-- Product Visual Display Box -->
      <g transform="translate(24, 24)">
        <rect width="692" height="320" rx="12" fill="url(#sneaker-art)" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />

        <!-- 3D Sneaker Vector Illustration -->
        <g transform="translate(140, 60)">
          <!-- Sole -->
          <path d="M 40,180 C 100,195 240,195 320,180 C 350,175 380,160 400,135 C 380,140 340,145 280,145 C 160,145 70,165 40,180 Z" fill="#f97316" opacity="0.9" />
          <!-- Midsole Cushioning -->
          <path d="M 40,170 C 120,175 220,175 310,165 C 340,160 370,145 385,130 C 350,135 280,140 220,140 C 120,140 60,160 40,170 Z" fill="#ffffff" opacity="0.85" />
          <!-- Upper Silhouette -->
          <path d="M 50,160 C 80,140 120,110 180,80 C 230,55 270,65 300,90 C 320,110 350,120 375,125 C 320,130 220,135 150,145 C 90,150 60,155 50,160 Z" fill="#141824" stroke="#f97316" stroke-width="2" />
          <!-- Lacing & Collar Details -->
          <path d="M 190,85 C 220,110 240,125 270,130" stroke="#f97316" stroke-width="3" fill="none" stroke-linecap="round" />
          <path d="M 210,75 C 235,98 255,115 285,120" stroke="#fbbf24" stroke-width="3" fill="none" stroke-linecap="round" />
          <!-- Glowing Heel Accent -->
          <circle cx="75" cy="150" r="8" fill="#f97316" filter="url(#amber-glow)" />
        </g>

        <!-- Product Badges -->
        <rect x="20" y="20" width="100" height="24" rx="6" fill="#f97316" />
        <text x="32" y="36" fill="#0c0e16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">NEW RELEASE</text>

        <rect x="560" y="20" width="112" height="24" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
        <text x="572" y="36" fill="#6ee7b7" font-family="monospace" font-size="10.5" font-weight="700">IN STOCK (3 LEFT)</text>
      </g>

      <!-- Product Details & Configuration Row -->
      <g transform="translate(24, 364)">
        <text x="0" y="28" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">
          Stealth Matrix-01 Carbon Runner
        </text>
        <text x="0" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
          Ultralight aerodynamic knit upper with dynamic carbon fiber stability plate.
        </text>

        <!-- Star Rating -->
        <g transform="translate(0, 68)">
          <text x="0" y="16" fill="#f59e0b" font-family="sans-serif" font-size="14">★★★★★</text>
          <text x="75" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">4.9 / 5.0</text>
          <text x="135" y="15" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">(824 verified buyer reviews)</text>
        </g>

        <!-- Price -->
        <text x="0" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800">
          $240.00 <tspan fill="#64748b" font-size="16" font-weight="500">USD</tspan>
        </text>

        <!-- Size Selector -->
        <g transform="translate(200, 102)">
          <rect width="44" height="34" rx="8" fill="#121622" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
          <text x="14" y="22" fill="#94a3b8" font-family="monospace" font-size="11">US 9</text>

          <g transform="translate(52, 0)">
            <rect width="44" height="34" rx="8" fill="#f97316" stroke="#f97316" stroke-width="1" />
            <text x="10" y="22" fill="#0c0e16" font-family="monospace" font-size="11" font-weight="800">US 10</text>
          </g>

          <g transform="translate(104, 0)">
            <rect width="44" height="34" rx="8" fill="#121622" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
            <text x="10" y="22" fill="#94a3b8" font-family="monospace" font-size="11">US 11</text>
          </g>

          <g transform="translate(156, 0)">
            <rect width="44" height="34" rx="8" fill="#121622" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
            <text x="10" y="22" fill="#94a3b8" font-family="monospace" font-size="11">US 12</text>
          </g>
        </g>

        <!-- Action Buttons -->
        <g transform="translate(460, 100)">
          <!-- Add to Cart -->
          <rect width="232" height="42" rx="10" fill="url(#amber-grad)" />
          <text x="64" y="26" fill="#0c0e16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">ADD TO CART</text>
        </g>
      </g>
    </g>

    <!-- Right: Mini Cart Drawer / Order Breakdown -->
    <g transform="translate(764, 64)" filter="url(#ecom-shadow)">
      <rect width="388" height="574" rx="14" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />

      <text x="24" y="38" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Order Bag (2)</text>
      <text x="280" y="38" fill="#f97316" font-family="monospace" font-size="12" font-weight="700">EDIT BAG</text>

      <!-- Cart Item 1 -->
      <g transform="translate(20, 60)">
        <rect width="348" height="100" rx="10" fill="#0f131f" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
        <rect x="12" y="12" width="76" height="76" rx="8" fill="#1b2133" />
        <circle cx="50" cy="50" r="16" fill="#f97316" opacity="0.4" />
        <text x="100" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Stealth Matrix-01</text>
        <text x="100" y="52" fill="#94a3b8" font-family="monospace" font-size="10.5">Size: US 10 • Obsidian Black</text>
        <text x="100" y="76" fill="#fdba74" font-family="monospace" font-size="12" font-weight="700">$240.00</text>
        <rect x="290" y="36" width="46" height="26" rx="6" fill="#141926" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
        <text x="306" y="53" fill="#ffffff" font-family="monospace" font-size="11">1x</text>
      </g>

      <!-- Cart Item 2 -->
      <g transform="translate(20, 172)">
        <rect width="348" height="100" rx="10" fill="#0f131f" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
        <rect x="12" y="12" width="76" height="76" rx="8" fill="#1b2133" />
        <circle cx="50" cy="50" r="16" fill="#10b981" opacity="0.4" />
        <text x="100" y="34" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">Aero Shield Windbreaker</text>
        <text x="100" y="52" fill="#94a3b8" font-family="monospace" font-size="10.5">Size: Medium • Matte Coal</text>
        <text x="100" y="76" fill="#fdba74" font-family="monospace" font-size="12" font-weight="700">$140.00</text>
        <rect x="290" y="36" width="46" height="26" rx="6" fill="#141926" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
        <text x="306" y="53" fill="#ffffff" font-family="monospace" font-size="11">1x</text>
      </g>

      <!-- Promo Code Pill -->
      <g transform="translate(20, 286)">
        <rect width="348" height="42" rx="8" fill="#0a0c13" stroke="#f97316" stroke-opacity="0.3" stroke-width="1" />
        <text x="18" y="26" fill="#6ee7b7" font-family="monospace" font-size="11">PROMO APPLIED: VIP-FREELANCE (-$40)</text>
      </g>

      <!-- Order Subtotal -->
      <g transform="translate(20, 348)">
        <text x="0" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Bag Subtotal</text>
        <text x="348" y="20" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="13">$380.00</text>

        <text x="0" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">VIP Discount</text>
        <text x="348" y="44" text-anchor="end" fill="#10b981" font-family="monospace" font-size="13">-$40.00</text>

        <text x="0" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Express Insured Freight</text>
        <text x="348" y="68" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="13">FREE</text>

        <line x1="0" y1="86" x2="348" y2="86" stroke="#ffffff" stroke-opacity="0.1" />

        <text x="0" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">Total Charged</text>
        <text x="348" y="112" text-anchor="end" fill="#f97316" font-family="monospace" font-size="20" font-weight="800">$340.00</text>
      </g>

      <!-- Apple Pay One-Touch Checkout -->
      <g transform="translate(20, 484)">
        <rect width="348" height="52" rx="12" fill="#000000" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
        <text x="140" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700"> Pay</text>
        <text x="194" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Checkout</text>
      </g>
    </g>
  </g>
</svg>
