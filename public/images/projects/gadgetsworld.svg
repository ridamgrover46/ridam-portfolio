          <text x="16" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">6.8" Dynamic AMOLED 2X (2600 nits peak)</text>

          <text x="16" y="80" fill="#64748b" font-family="monospace" font-size="10">PRIMARY CAMERA SENSOR</text>
          <text x="16" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">200MP Isocell HP2 with 5x Periscope Zoom</text>

          <text x="16" y="132" fill="#64748b" font-family="monospace" font-size="10">BATTERY &amp; ENDURANCE</text>
          <text x="16" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">5,000 mAh • 30h Video Playback Loop</text>

          <text x="16" y="184" fill="#64748b" font-family="monospace" font-size="10">THERMAL HEADROOM</text>
          <text x="16" y="202" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">86% Sustained with Vapor Chamber</text>
        </g>

        <rect x="20" y="490" width="328" height="42" rx="10" fill="#141824" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
        <text x="100" y="516" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="600">VIEW FULL BREAKDOWN</text>
      </g>

      <!-- Right Column: Device 3 (Google Pixel 9 Pro - Tensor G4) -->
      <g transform="translate(784, 0)">
        <rect width="368" height="570" rx="14" fill="url(#panel-gw)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
        <rect x="20" y="20" width="76" height="22" rx="6" fill="#141824" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
        <text x="28" y="35" fill="#94a3b8" font-family="monospace" font-size="10" font-weight="700">RANK #3</text>

        <text x="20" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Google Pixel 9 Pro</text>
        <text x="20" y="94" fill="#94a3b8" font-family="monospace" font-size="12">Google Tensor G4 (Titan M2 Security)</text>

        <g transform="translate(20, 120)">
          <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Geekbench 6 Multi-Core</text>
          <text x="328" y="16" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="13" font-weight="800">4,950 pts</text>
          <rect x="0" y="24" width="328" height="10" rx="5" fill="#0a0c13" />
          <rect x="0" y="24" width="190" height="10" rx="5" fill="#38bdf8" />
        </g>

        <g transform="translate(20, 180)">
          <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">AnTuTu v10 Score</text>
          <text x="328" y="16" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="13" font-weight="800">1,340,900</text>
          <rect x="0" y="24" width="328" height="10" rx="5" fill="#0a0c13" />
          <rect x="0" y="24" width="200" height="10" rx="5" fill="#38bdf8" />
        </g>

        <g transform="translate(20, 240)">
          <rect width="328" height="230" rx="10" fill="#0d1017" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

          <text x="16" y="28" fill="#64748b" font-family="monospace" font-size="10">DISPLAY PANEL</text>
          <text x="16" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">6.3" Super Actua OLED (3000 nits peak)</text>

          <text x="16" y="80" fill="#64748b" font-family="monospace" font-size="10">PRIMARY CAMERA SENSOR</text>
          <text x="16" y="98" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">50MP Octa PD with Gemini On-Device AI</text>

          <text x="16" y="132" fill="#64748b" font-family="monospace" font-size="10">BATTERY &amp; ENDURANCE</text>
          <text x="16" y="150" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">4,700 mAh • 24h+ Smart Adaptive Battery</text>

          <text x="16" y="184" fill="#64748b" font-family="monospace" font-size="10">THERMAL HEADROOM</text>
          <text x="16" y="202" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">88% Sustained with Tensor TPU</text>
