      <g transform="translate(0, 0)">
        <rect width="368" height="570" rx="14" fill="url(#panel-gw)" stroke="#f97316" stroke-opacity="0.4" stroke-width="1.5" />
        <rect x="20" y="20" width="76" height="22" rx="6" fill="#f97316" />
        <text x="28" y="35" fill="#0c0e16" font-family="monospace" font-size="10" font-weight="800">LEADER #1</text>

        <!-- Device Name & Spec -->
