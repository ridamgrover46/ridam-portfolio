        <text x="20" y="94" fill="#fdba74" font-family="monospace" font-size="12" font-weight="700">Apple A18 Pro (3nm TSMC)</text>

        <!-- Geekbench 6 Multi-Core Bar -->
        <g transform="translate(20, 120)">
          <text x="0" y="16" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Geekbench 6 Multi-Core</text>
          <text x="328" y="16" text-anchor="end" fill="#ffffff" font-family="monospace" font-size="13" font-weight="800">8,640 pts</text>
          <rect x="0" y="24" width="328" height="10" rx="5" fill="#0a0c13" />
          <rect x="0" y="24" width="320" height="10" rx="5" fill="url(#amber-gw)" filter="url(#gw-glow)" />
