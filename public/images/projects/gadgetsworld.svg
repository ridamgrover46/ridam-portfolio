<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="gw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090d" />
      <stop offset="50%" stop-color="#0e1018" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <linearGradient id="amber-gw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="panel-gw" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#0b0e15" />
    </linearGradient>

    <filter id="gw-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f97316" flood-opacity="0.12" />
    </filter>

    <filter id="gw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="750" fill="url(#gw-bg)" rx="16" />
  <rect width="1198" height="748" x="1" y="1" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" rx="15" />

  <!-- Window Header -->
  <rect x="0" y="0" width="1200" height="46" fill="#090b12" rx="16" />
  <circle cx="28" cy="23" r="5.5" fill="#ef4444" opacity="0.85" />
  <circle cx="48" cy="23" r="5.5" fill="#f59e0b" opacity="0.85" />
  <circle cx="68" cy="23" r="5.5" fill="#10b981" opacity="0.85" />

  <rect x="100" y="11" width="380" height="24" rx="6" fill="#141824" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
  <circle cx="116" cy="23" r="3" fill="#10b981" />
  <text x="128" y="27" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">
    gadgetsworld.dev / compare / flagships / silicon-benchmarks-2025
  </text>

  <!-- Benchmark Sync Badge -->
  <rect x="1010" y="12" width="166" height="22" rx="11" fill="#f97316" fill-opacity="0.12" stroke="#f97316" stroke-opacity="0.3" stroke-width="1" />
  <circle cx="1024" cy="23" r="3.5" fill="#f97316" />
  <text x="1036" y="27" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">
    GEEKBENCH 6 &amp; ANTUTU V10
  </text>

  <!-- Main Comparison Content -->
  <g transform="translate(24, 64)">
    <!-- Header Title & Filter Matrix -->
    <g transform="translate(0, 0)">
      <rect width="1152" height="52" rx="10" fill="url(#panel-gw)" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
      <text x="20" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">GADGETSWORLD SPEC MATRIX</text>

      <!-- Category Tabs -->
      <g transform="translate(360, 10)">
        <rect width="110" height="32" rx="8" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-opacity="0.4" stroke-width="1" />
        <text x="16" y="21" fill="#fdba74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Flagship Phones</text>

        <g transform="translate(118, 0)">
          <rect width="90" height="32" rx="8" fill="#0d1017" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
          <text x="16" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Ultrabooks</text>
        </g>

        <g transform="translate(216, 0)">
